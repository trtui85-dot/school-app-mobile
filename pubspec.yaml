name: schoolapp
description: "مدارس اقرأ الحديثة — تطبيق متابعة التسجيل والرسوم والغياب"
publish_to: 'none'

version: 1.0.5+9

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.0.0
  cookie_jar: ^4.0.0
  dio_cookie_manager: ^3.0.0
  provider: ^6.0.0
  shared_preferences: ^2.0.0
  intl: any
  google_fonts: ^6.0.0
  image_picker: 1.1.2
  flutter_image_compress: ^2.0.0
  image: ^4.0.0
  path_provider: ^2.0.0
  url_launcher: ^6.0.0
  package_info_plus: ^8.0.0
  gal: ^2.0.0
  printing: ^5.0.0
  pdf: ^3.0.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  image_picker_android: 0.8.13+19

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_white.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
