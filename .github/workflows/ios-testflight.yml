name: Build and Upload iOS to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/iqra.mobileprovision"

      - name: Configure manual distribution signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project = Path("ios/Runner.xcodeproj/project.pbxproj")
          contents = project.read_text()
          contents = contents.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")
          contents = contents.replace("iPhone Developer", "Apple Distribution")
          contents = contents.replace(
              "CODE_SIGN_STYLE = Manual;",
              "CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = AB2B2FFS68;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"Iqra App Store Push\";",
          )
          contents = contents.replace(
              "PRODUCT_BUNDLE_IDENTIFIER = com.iqra.schoolapp;",
              "PRODUCT_BUNDLE_IDENTIFIER = com.iqra.schoolapp;\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = \"Apple Distribution\";\n\t\t\t\tDEVELOPMENT_TEAM = AB2B2FFS68;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"Iqra App Store Push\";",
          )
          project.write_text(contents)
          PY

      - name: Verify signing identity
        run: security find-identity -v -p codesigning

      - name: Build IPA
        run: |
          flutter build ios --release --no-codesign --build-number="$GITHUB_RUN_NUMBER"
          python3 - <<'PY'
          from pathlib import Path

          project = Path("ios/Runner.xcodeproj/project.pbxproj")
          contents = project.read_text()
          contents = contents.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")
          contents = contents.replace("iPhone Developer", "Apple Distribution")
          contents = contents.replace(
              "CODE_SIGN_STYLE = Manual;",
              "CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = AB2B2FFS68;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"Iqra App Store Push\";",
          )
          project.write_text(contents)
          PY
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=AB2B2FFS68 \
            CODE_SIGN_IDENTITY="Apple Distribution"
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: build/ios/ipa/Runner.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
